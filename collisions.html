<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Momentum & Collisions Simulation</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Matter.js CDN -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
</head>
<body class="bg-slate-50 text-slate-800 font-sans p-6">
    <div class="max-w-4xl mx-auto space-y-6">
        <nav class="flex items-center justify-between">
            <a href="index.html" class="text-sm font-semibold text-blue-600 hover:underline">&larr; Back to Modules</a>
            <h1 class="text-xl font-bold text-slate-900">Customizable Momentum & Collisions Lab</h1>
        </nav>
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 items-start">
            <div class="md:col-span-2 bg-white p-4 rounded-xl shadow-sm border border-slate-200 flex flex-col items-center">
                <canvas id="simCanvas" width="500" height="300" class="border border-slate-100 rounded-lg bg-white"></canvas>
                <div class="flex gap-4 mt-4 w-full justify-center">
                    <button id="runBtn" class="px-5 py-2 bg-rose-600 text-white font-medium rounded-lg shadow hover:bg-rose-700 transition">Trigger Impact</button>
                    <button id="resetBtn" class="px-5 py-2 bg-slate-200 text-slate-700 font-medium rounded-lg hover:bg-slate-300 transition">Reset</button>
                </div>
            </div>
            <div class="space-y-6">
                <div class="bg-slate-900 text-white p-4 rounded-xl shadow-sm">
                    <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">System Momentum</h2>
                    <div class="space-y-2 text-sm font-mono">
                        <div class="flex justify-between"><span>Total P:</span> <span id="statMom" class="text-rose-400 font-bold">0.00</span> kg&middot;m/s</div>
                    </div>
                </div>
                <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 space-y-4">
                    <h2 class="text-sm font-semibold text-slate-400 uppercase tracking-wider">Custom Controls</h2>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><label for="m1Input">Mass 1 (m₁):</label><span id="m1Val" class="font-semibold text-rose-600">2.0 kg</span></div>
                        <input type="range" id="m1Input" min="0.5" max="10" step="0.5" value="2" class="w-full accent-rose-600 cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><label for="v1Input">Velocity 1 (v₁):</label><span id="v1Val" class="font-semibold text-rose-600">4.0 m/s</span></div>
                        <input type="range" id="v1Input" min="1" max="10" step="0.5" value="4" class="w-full accent-rose-600 cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><label for="m2Input">Mass 2 (m₂):</label><span id="m2Val" class="font-semibold text-rose-600">3.0 kg</span></div>
                        <input type="range" id="m2Input" min="0.5" max="10" step="0.5" value="3" class="w-full accent-rose-600 cursor-pointer">
                    </div>
                    <div>
                        <div class="flex justify-between text-sm mb-1"><label for="eInput">Elasticity (e):</label><span id="eVal" class="font-semibold text-rose-600">1.0</span></div>
                        <input type="range" id="eInput" min="0.0" max="1.0" step="0.1" value="1.0" class="w-full accent-rose-600 cursor-pointer">
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="js/collisions.js"></script>
</body>
</html>
