<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Standing Waves Lab - Physics Simulations Lab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #F8F9FA; }
        .font-mono { font-family: 'JetBrains Mono', monospace; }
        input[type=range] { accent-color: #4f46e5; }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-100">
        <div class="max-w-[1100px] mx-auto px-6 h-16 flex items-center justify-between">
            <a href="../index.html" class="text-indigo-600 font-black text-xl tracking-tight flex items-center gap-2">
                <span>⚛</span>
                <span>Physics Simulations Lab</span>
            </a>
            <div class="flex items-center gap-4">
                <span class="bg-purple-50 text-purple-600 border border-purple-200 font-bold text-[10px] px-2.5 py-1 rounded-md uppercase tracking-wide">Grade 12 · Ch. 9</span>
                <a href="../lab.html" class="text-indigo-600 font-semibold text-sm hover:text-indigo-800 transition-colors">&larr; All Labs</a>
            </div>
        </div>
    </nav>

    <!-- Main Content -->
    <main class="flex-grow w-full max-w-[1100px] mx-auto px-6 py-8">
        <h1 class="text-[22px] font-bold text-slate-900 tracking-tight mb-8">Harmonics & Standing Waves Lab</h1>
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <!-- Canvas Simulation Area -->
            <div class="lg:col-span-2 bg-white p-8 rounded-[24px] shadow-sm border border-slate-100 flex flex-col items-center">
                <canvas id="simCanvas" width="600" height="300" class="w-full max-w-[600px] rounded-xl bg-slate-50 border border-slate-100"></canvas>
                <div class="flex gap-4 mt-8 w-full justify-center">
                    <button id="toggleBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white font-medium text-sm py-2.5 px-6 rounded-xl transition-colors shadow-sm">Pause / Play</button>
                    <button id="envelopeBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium text-sm py-2.5 px-6 rounded-xl transition-colors">Toggle Envelope</button>
                </div>
            </div>
            
            <!-- Telemetry & Controls Sidebar -->
            <div class="space-y-6">
                <!-- Wave Telemetry -->
                <div class="bg-[#1a1f2e] p-6 rounded-[24px] shadow-sm text-white">
                    <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-5">Wave Telemetry</h2>
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-300">Wavelength (λ):</span>
                            <div class="font-mono text-sm"><span id="statLambda" class="text-amber-400">2.00</span> m</div>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-300">Wave Speed (v):</span>
                            <div class="font-mono text-sm"><span id="statSpeed" class="text-sky-400">20.0</span> m/s</div>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-300">Nodes / Antinodes:</span>
                            <div class="font-mono text-sm"><span id="statNodes" class="text-emerald-400 font-bold">2 / 1</span></div>
                        </div>
                        <div class="flex justify-between pt-2 border-t border-slate-700/50 mt-2">
                            <span class="text-sm text-slate-300">State:</span>
                            <div class="font-mono text-sm"><span id="statState" class="text-emerald-400 font-bold">Resonant (n = 1)</span></div>
                        </div>
                    </div>
                </div>

                <!-- Controls -->
                <div class="bg-white p-6 rounded-[24px] shadow-sm border border-slate-100">
                    <h2 class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-5">Wave Controls</h2>
                    <div class="space-y-5">
                        <div>
                            <div class="flex justify-between text-sm mb-2">
                                <label class="text-slate-500">Harmonic Mode (n):</label>
                                <span id="harmonicVal" class="text-indigo-600 font-medium">1st (Fundamental)</span>
                            </div>
                            <input type="range" id="harmonicInput" min="1" max="6" step="1" value="1" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-2">
                                <label class="text-slate-500">Frequency (f):</label>
                                <span id="freqVal" class="text-indigo-600 font-medium">10.0 Hz</span>
                            </div>
                            <input type="range" id="freqInput" min="2" max="60" step="1" value="10" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-2">
                                <label class="text-slate-500">Amplitude (A):</label>
                                <span id="ampVal" class="text-indigo-600 font-medium">40 px</span>
                            </div>
                            <input type="range" id="ampInput" min="10" max="80" step="5" value="40" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-2">
                                <label class="text-slate-500">String Length (L):</label>
                                <span id="lengthVal" class="text-indigo-600 font-medium">2.0 m</span>
                            </div>
                            <input type="range" id="lengthInput" min="1.0" max="4.0" step="0.2" value="2.0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>
            </div>

        </div>
    </main>

    <!-- Local Progress Recorder -->
    <script>
        document.getElementById('toggleBtn')?.addEventListener('click', () => {
            const completed = JSON.parse(localStorage.getItem('burmalab_completed') || '[]');
            if (!completed.includes('standing-waves')) {
                completed.push('standing-waves');
                localStorage.setItem('burmalab_completed', JSON.stringify(completed));
            }
        }, { once: true });
    </script>

    <!-- Simulation Script -->
    <script src="../js/standing-waves.js"></script>
</body>
</html>
