<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uniform Circular Motion - Physics Simulations Lab</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Fonts matching your UI -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
    <style>
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background-color: #F8F9FA; 
        }
        .font-mono { 
            font-family: 'JetBrains Mono', monospace; 
        }
        input[type=range] {
            accent-color: #4f46e5;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col text-slate-800">
    
    <!-- Top Navigation (Standalone) -->
    <nav class="bg-white">
        <div class="max-w-[1100px] mx-auto px-6 h-16 flex items-center justify-between">
            <a href="/" class="text-indigo-600 font-black text-xl tracking-tight">Physics Simulations Lab</a>
            <div class="flex items-center gap-4">
                <span class="bg-indigo-50 text-indigo-600 border border-indigo-100 font-bold text-[10px] px-2 py-1 rounded-md uppercase tracking-wide">Grade 11 Ch.1</span>
                <a href="../lab.html" class="text-indigo-600 font-semibold text-sm hover:text-indigo-800 transition-colors">&larr; All Labs</a>
            </div>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="flex-grow w-full max-w-[1100px] mx-auto px-6 py-8">
        <h1 class="text-[22px] font-bold text-slate-900 tracking-tight mb-8">Uniform Circular Motion</h1>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 items-start">
            
            <!-- Left Column: Canvas & Buttons -->
            <div class="lg:col-span-2 bg-white p-8 rounded-[24px] shadow-sm flex flex-col items-center">
                <canvas id="simCanvas" width="500" height="350" class="w-full max-w-[500px] rounded-xl"></canvas>
                
                <div class="flex gap-4 mt-8 w-full justify-center">
                    <button id="toggleBtn" class="bg-indigo-500 hover:bg-indigo-600 text-white font-medium text-sm py-2.5 px-6 rounded-xl transition-colors">Start / Pause</button>
                    <button id="vectorsBtn" class="bg-slate-100 hover:bg-slate-200 text-slate-600 font-medium text-sm py-2.5 px-6 rounded-xl transition-colors">Toggle Vectors</button>
                </div>
            </div>
            
            <!-- Right Column: Telemetry & Controls -->
            <div class="space-y-6">
                
                <!-- Telemetry Card (Dark Theme) -->
                <div class="bg-[#1a1f2e] p-6 rounded-[24px] shadow-sm text-white">
                    <h2 class="text-[10px] font-bold text-slate-400 uppercase tracking-widest mb-5">Live Telemetry</h2>
                    
                    <div class="space-y-3">
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-300">Period (T):</span>
                            <div class="font-mono text-sm">
                                <span id="statPeriod" class="text-emerald-400 font-semibold">0.00</span> <span class="text-slate-500 ml-1">s</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-300">Centripetal Accel (a_c):</span>
                            <div class="font-mono text-sm">
                                <span id="statAcc" class="text-amber-400 font-semibold">0.00</span> <span class="text-slate-500 ml-1">m/s²</span>
                            </div>
                        </div>
                        <div class="flex justify-between items-center">
                            <span class="text-sm text-slate-300">Centripetal Force (F_c):</span>
                            <div class="font-mono text-sm">
                                <span id="statForce" class="text-rose-400 font-semibold">0.0</span> <span class="text-slate-500 ml-1">N</span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Controls Card (Light Theme) -->
                <div class="bg-white p-6 rounded-[24px] shadow-sm">
                    <h2 class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest mb-5">Parameters</h2>
                    
                    <div class="space-y-6">
                        <div>
                            <div class="flex justify-between text-sm mb-3">
                                <label class="text-slate-500" for="massInput">Mass (m):</label>
                                <span id="massVal" class="text-sky-500 font-medium">2.0 kg</span>
                            </div>
                            <input type="range" id="massInput" min="0.5" max="5.0" step="0.5" value="2.0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-3">
                                <label class="text-slate-500" for="radiusInput">Radius (r):</label>
                                <span id="radiusVal" class="text-indigo-500 font-medium">2.0 m</span>
                            </div>
                            <input type="range" id="radiusInput" min="1.0" max="4.0" step="0.5" value="2.0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                        <div>
                            <div class="flex justify-between text-sm mb-3">
                                <label class="text-slate-500" for="velInput">Tangential Velocity (v):</label>
                                <span id="velVal" class="text-emerald-500 font-medium">3.0 m/s</span>
                            </div>
                            <input type="range" id="velInput" min="1.0" max="8.0" step="0.5" value="3.0" class="w-full h-1.5 bg-slate-200 rounded-lg appearance-none cursor-pointer">
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </main>
    
    <!-- Link to the JS logic -->
    <script src="../js/circular-motion.js"></script>
</body>
</html>
