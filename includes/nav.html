<script>
function toggleMobileMenu() {
    const menu = document.getElementById('mobileMenu');
    const drawer = document.getElementById('mobileDrawer');
    if (!menu || !drawer) return;

    if (menu.classList.contains('hidden')) {
        menu.classList.remove('hidden');
        setTimeout(() => {
            menu.classList.remove('opacity-0');
            drawer.classList.remove('translate-x-full');
        }, 10);
    } else {
        menu.classList.add('opacity-0');
        drawer.classList.add('translate-x-full');
        setTimeout(() => menu.classList.add('hidden'), 300);
    }
}

// Client-side active page detector and username loader
document.addEventListener('DOMContentLoaded', () => {
    // 1. Username sync
    const username = localStorage.getItem('burmalab_username') || 'Student';
    const badge = document.getElementById('navUsernameBadge');
    const mobileName = document.getElementById('mobileUsernameDisplay');
    const mobileAvatar = document.getElementById('mobileAvatarInitial');

    if (badge) badge.textContent = username;
    if (mobileName) mobileName.textContent = username;
    if (mobileAvatar) mobileAvatar.textContent = username.charAt(0).toUpperCase();

    // 2. Active URL highlight
    const path = window.location.pathname;
    const current = path.split('/').pop() || 'index.html';

    document.querySelectorAll('.nav-item').forEach(link => {
        const target = link.getAttribute('data-page');
        if (target && (current === target || (target === 'lab' && path.includes('/lab')))) {
            link.classList.add('text-indigo-600', 'font-extrabold');
        }
    });

    document.querySelectorAll('.mobile-nav-item').forEach(link => {
        const target = link.getAttribute('data-page');
        if (target && (current === target || (target === 'lab' && path.includes('/lab')))) {
            link.classList.add('bg-indigo-50', 'text-indigo-600');
        }
    });
});
</script>
